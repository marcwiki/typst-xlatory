heading_lvl_1_h1_id_1=Eine Umgebung zur Erstellung und Übersetzung von PDF Dokumenten
heading_lvl_2_h2_id_2=Zielsetzung
text_p_id_3=- Die erstellten PDF Dokumente sollen bis ins Detail kontrollierbar und definierbar sein.
text_p_id_4=- Die Umgebung soll die effiiente Bereitstellung von Dokumenten in mehreren Sprachen ermöglichen.
text_p_id_5=- Der Fokus liegt auf Textinhalten, mathematische Formeln werden nicht unterstützt.
text_p_id_6=- Ein späterer Ausbau zur automatisierten Erstellung von alternativen Formaten wie HTML oder Obisian Markdown soll mit vernünfitem Aufwand möglich sein.
text_p_id_7=- Es sollen ausschliesslich Open Source Komponenten zum Einsatz kommen.
heading_lvl_2_h2_id_8=Entstehungsgeschichte und Architektur
text_p_id_9=Zu Beginn nahm ich an, dass der EPUB 3 Standard eine sinnvolle Basis sein könnte, und habe mit allerlei PDF Generatoren versucht, ein komplexeres Format zu erstellen. Dies gelang mir einzig mit dem Prince-Generator einigermassen, was leider nicht Open Source ist, und auch sehr aufwendig werden kann, wenn die Vorgaben komplex sind. Die Idee war für mich verlockend, eine Single Source of Truth im Epub 3 Format, und daraus sollten die PDF-Formate erstellt werden. Ein Buch wäre so automatisch als Print-Medium wie auch als Epub verfügbar. Da ein Epub intern HTML verwendet, war die Einbindung von OmegaT als Übersetzhungsumgebung gut unterstützt. Diesen Ansatz musst ich irgendwann als gescheitert betrachten, da die mir verfügbaren Open Source PDF Generatoren eine präzise Gestaltung von PDF-Formaten nicht unterstützt haben.
text_p_id_10=Also habe ich meinen Blickwinkel darauf gerichtet, welche Umgebungen es überhaupt gibt, die eine effiziente und präzise Umsetzung von PDF Formaten erlauben. Dabei bin ich auf Typst gestossen, das meistens in akademischen Umgebungen verwendet wird, und unter vielem anderen auch die Darstellung von mathematischen Formeln erlaubt. Auf jeden Fall unterstützt Typst die Umsetzung von Texten nach PDF bestens, man muss ja nicht das ganze Funktionsspektrum nutzen. Ein weiterer grosser Vorteil von Typst liegt in seinen Möglichkeiten zur Standardisierung von Vereinheitlichung von Formaten. Bei der Übersetzung einer ganzen Buchreihe mit ähnlichen oder gleichen Formaten kann man auf eine einzige Bibliothek von Formatierungsfunktionen zurückgreifen, und alle Bücher der Reihe werden in allen Sprachen gleich formatiert, sofern die Sprachen von links nach rechts und von oben nach unten geschrieben werden.
text_p_id_11=Allerdings konnte ich zunächst meine OmegaT Übersetzungsumgebung nicht auf Typst-Dateien anwenden, es gab keine Filter mit ausreichender Funktionalität. Also habe ich ein Programm geschrieben, das Typst-Dateien in eine für OmegaT lesbare Struktur bringt. Dabei erhält jeder Absatz in Typst ein Label mit einer ID, und diese ID ist dann der Schlüssel zu den Texten in OmegaT. Ein Zusatzprogramm nimmt die übersetzten Texte und erstellt aus dem Originaldokument und diesen Texten ein übersetztes Dokument, das genau so formatiert ist wie das Original.
text_p_id_12=Damit ist das Typst-Originaldokument meine "Single Source of Truth" und gibt die Struktur sowie das Format vor für allen übersetzten Dokumente.
text_p_id_13=Da ich den von mir verwendeten Sprachumfang von Typst recht gut kenne, könnte ich statt der Schlüssel-Wert-Paare wahlweise auch andere Formate generieren, zum Beispiel HTML oder Obisian Markup.
heading_lvl_1_h1_einfuehrung=Einführung und Motivation
text_p_intro-1=Wer ein Buch oder eine umfangreiche Dokumentation in Typst schreibt und in mehrere Sprachen übersetzen möchte, stösst schnell auf ein klassisches Problem. Kopiert man die `.typ`-Dateien für jede Sprache und übersetzt direkt im Quelltext, laufen Layout und Inhalt auseinander.
text_p_intro-2=Jede spätere Anpassung an Schriftgrössen, Abständen oder Makros muss dann mühsam in jeder einzelnen Sprachdatei nachgezogen werden. Gleichzeitig fehlen in einem reinen Texteditor wichtige Werkzeuge professioneller Übersetzer wie Translation Memories und Terminologie-Datenbanken.
heading_lvl_2_h2_loesung=Die Lösung: Trennung von Inhalt und Layout
text_p_loesung-1=Dieses Werkzeug schlägt eine Brücke zwischen der modernen Satzwelt von Typst und etablierten Übersetzungsprogrammen (CAT-Tools). Statt rohe Typst-Dateien manuell zu duplizieren, extrahiert der Transpiler ausschliesslich die übersetzbaren Texte in standardisierte Java-`.properties`-Dateien.
text_p_loesung-2=Nach der Übersetzung setzt der Reconstructor die Zieltexte wieder exakt in die ursprüngliche Typst-Struktur ein. Alle Layout-Anweisungen, Abstände, Verweise und benutzerdefinierten Funktionen bleiben dabei vollständig erhalten.
heading_lvl_2_h2_loose-coupling=Tool-Unabhängigkeit (Loose Coupling)
text_p_coupling-1=Das System ist bewusst nicht an ein bestimmtes Übersetzungsprogramm gebunden. Da als Austauschformat gewöhnliche `.properties`-Dateien dienen, lässt sich der Workflow problemlos mit Programmen wie OmegaT, Poedit, Weblate oder Crowdin verbinden.
text_p_coupling-2=Wechselt ein Autor später das Übersetzungswerkzeug, bleiben sämtliche Typst-Quelldateien und die Projekt-Konfiguration unverändert.
heading_lvl_1_h1_installation=Installation und Voraussetzungen
text_p_inst-1=Für den Einsatz der Übersetzungs-Pipeline werden drei Komponenten auf dem System benötigt:
text_p_inst-list-1=- <b>Typst</b> : Zum Kompilieren der fertigen `.typ`-Dateien in druckfertige PDF-Dokumente.
text_p_inst-list-2=- <b>Ein CAT-Tool</b> : Zum Beispiel das kostenlose Open-Source-Programm OmegaT für die eigentliche Übersetzungsarbeit.
text_p_inst-list-3=- <b>typst-json-printer</b> : Das kompilierte Kommandozeilen-Werkzeug für den Export und Import der Texte.
heading_lvl_2_h2_verzeichnisstruktur=Empfohlene Verzeichnisstruktur
text_p_dir-1=Damit Vorlagen, Originaltexte, Übersetzungsdateien und fertige Sprachausgaben sauber getrennt bleiben, empfiehlt sich folgende Ordnerstruktur pro Buchprojekt:
text_p_dir-2=Die einzelnen Verzeichnisse erfüllen folgende Aufgaben:
text_p_dir-list-1=- <b>`projekt.yaml`</b> : Zentrale Konfigurationsdatei für Pfade und Übersetzungsregeln.
text_p_dir-list-2=- <b>`lib/`</b> : Gemeinsame Typst-Vorlagen und Layout-Makros für alle Sprachen.
text_p_dir-list-3=- <b>`src_de/`</b> : Originaltexte des Buches in der Quellsprache.
text_p_dir-list-4=- <b>`i18n/source/`</b> : Exportierte `.properties`-Dateien als Eingabe für das CAT-Tool.
text_p_dir-list-5=- <b>`i18n/target_en/` und `i18n/target_ru/`</b> : Übersetzte `.properties`-Dateien aus dem CAT-Tool.
text_p_dir-list-6=- <b>`out_en/` und `out_ru/`</b> : Rekonstruierte, kompilierbare Typst-Dateien in den Zielsprachen.
text_p_dir-2=Alle rekonstruierten Sprachversionen greifen über relative Pfade auf denselben `lib/`-Ordner zu. Eine Design-Änderung in der Vorlage wirkt sich dadurch sofort auf sämtliche Sprachausgaben aus.
heading_lvl_1_h1_schnellstart=Schnellstart
text_p_quick-1=In fünf kurzen Schritten entsteht aus einem deutschen Typst-Dokument eine mehrsprachige Publikation.
heading_lvl_2_h2_schritt-1=Schritt 1: Quelldatei mit Labels anlegen
text_p_s1-1=Lege im Ordner `src_de/` eine Datei `kapitel1.typ` an und versehe Überschriften sowie Absätze mit eindeutigen Labels in spitzen Klammern:
heading_lvl_2_h2_schritt-2=Schritt 2: Projekt-Konfiguration erstellen
text_p_s2-1=Erstelle im Hauptordner des Projekts eine Datei `projekt.yaml`, welche die Verzeichnisse und Zielsprachen festlegt:
heading_lvl_2_h2_schritt-3=Schritt 3: Texte für die Übersetzung exportieren
text_p_s3-1=Starte den Export über die Kommandozeile:
text_p_s3-2=Im Ordner `i18n/source/` liegt nun die Datei `kapitel1.properties` mit allen extrahierten Textsegmenten bereit.
heading_lvl_2_h2_schritt-4=Schritt 4: Übersetzung im CAT-Tool durchführen
text_p_s4-1=Lade die Datei `kapitel1.properties` in dein Übersetzungsprogramm (z. B. OmegaT) und erzeuge nach der Übersetzung die Zieldateien in `i18n/target_en/` beziehungsweise `i18n/target_ru/`.
heading_lvl_2_h2_schritt-5=Schritt 5: Zielsprachen rekonstruieren und PDF bauen
text_p_s5-1=Führe abschliessend den Import-Befehl aus und kompiliere die erzeugten Typst-Dateien:
text_p_s5-2=In den Zielordnern stehen nun fertige Typst-Dateien und PDFs in allen konfigurierten Sprachen bereit.
heading_lvl_1_h1_best-practices=Typst für die Übersetzung strukturieren
text_p_bp-1=Damit der Roundtrip zwischen Typst und dem CAT-Tool auch bei grösseren Buchprojekten zuverlässig funktioniert, haben sich einige Grundregeln für das Schreiben der Quelldateien bewährt.
heading_lvl_2_h2_labels=Eindeutige Labels nutzen
text_p_labels-1=Jede Überschrift, jeder Absatz und jede übersetzbare Funktion sollte mit einem eindeutigen Label in spitzen Klammern abgeschlossen werden, beispielsweise `<p:einleitung-1>` oder `<box:merksatz-2>`.
text_p_labels-2=Ohne explizites Label vergibt der Transpiler automatisch fortlaufende Nummern. Fügt ein Autor später mitten im Kapitel einen neuen Absatz ein, verschieben sich alle nachfolgenden Nummern, was im CAT-Tool zu falschen Zuordnungen führen kann.
text_p_labels-3=Mit festen Labels bleibt jedes Textsegment dauerhaft an seinen Bezeichner gebunden, unabhängig davon, wo im Dokument Absätze ergänzt oder verschoben werden.
heading_lvl_2_h2_information-hiding=Information Hiding anwenden
text_p_ih-1=Komplexe Layout-Anweisungen wie `#set par(...)`, `#show ...` oder verschachtelte `#block(...)`-Container gehören nicht direkt in den Fliesstext. Lagere solche Formatierungen konsequent als benannte Funktionen in deine Vorlagendatei im `lib/`-Ordner aus.
text_p_ih-2=Im eigentlichen Kapiteltext rufst du anschliessend nur noch kompakte, einzeilige Makros auf. Dadurch sieht der Übersetzer im CAT-Tool ausschliesslich den reinen Inhalt ohne störenden Layout-Code.
heading_lvl_2_h2_eigene-funktionen=Eigene Typst-Funktionen gestalten
text_p_fn-1=Eigene Layout-Komponenten wie Infoboxen, Zitatkästen oder Fazit-Blöcke werden vom Transpiler automatisch erkannt. Übergibst du den Haupttext in eckigen Klammern, exportiert ihn das Werkzeug direkt als übersetzbares Segment.
text_p_fn-2=Zusätzlich erkennt der Transpiler alle benannten Argumente, deren Wert in doppelten Anführungszeichen steht. Ein Aufruf wie `#fazit(title: "Zusammenfassung:")[Der eigentliche Inhalt.] <box:fazit-1>` erzeugt automatisch zwei getrennte Einträge in der `.properties`-Datei: einen für den Titel und einen für den Inhalt.
heading_lvl_1_h1_konfiguration=Konfigurations-Referenz
text_p_cfg-1=Das gesamte Verhalten der Export- und Import-Pipeline wird über eine zentrale YAML-Datei gesteuert. Über den Parameter `--config` lässt sich für jedes Buchprojekt eine eigene Konfigurationsdatei angeben.
heading_lvl_2_h2_cfg-project=Bereich project
text_p_cfg-proj-1=Unter `project` werden die gemeinsamen Ausgangsverzeichnisse des Projekts festgelegt:
text_p_cfg-proj-list-2=- <b>`source_dir`</b> : Pfad zum Verzeichnis mit den Typst-Quelldateien in der Originalsprache. <p:cfg-proj-list-1> - <b>`i18n_source_dir`</b> : Zielordner, in den die generierten `.properties`-Dateien für das CAT-Tool geschrieben werden.
heading_lvl_2_h2_cfg-targets=Bereich targets
text_p_cfg-tgt-1=Unter `targets` lässt sich eine beliebige Anzahl an Zielsprachen definieren. Beim Aufruf mit `--import` verarbeitet das Werkzeug alle aufgeführten Sprachen in einem einzigen Durchgang:
text_p_cfg-tgt-list-3=- <b>`lang`</b> : Kurzbezeichnung der Zielsprache zur Protokollierung auf der Konsole (zum Beispiel `en` oder `ru`). <p:cfg-tgt-list-1> - <b>`i18n_target_dir`</b> : Verzeichnis, in dem das CAT-Tool die übersetzten `.properties`-Dateien dieser Sprache ablegt. <p:cfg-tgt-list-2> - <b>`output_dir`</b> : Zielverzeichnis für die fertig rekonstruierten Typst-Dateien der jeweiligen Sprache.
heading_lvl_2_h2_cfg-hide=Bereich hide_functions
text_p_cfg-hide-1=Funktionen, die ausschliesslich das Layout steuern und keinen übersetzbaren Text enthalten (wie `pagebreak`, `outline`, `v` oder `h`), werden unter `hide_functions` aufgelistet. Diese Aufrufe werden beim Export übersprungen und beim Import unverändert in das Zieldokument übernommen.
heading_lvl_2_h2_cfg-ignore-args=Bereich ignore_named_args
text_p_cfg-ign-1=Manche Typst-Funktionen erwarten technische Parameter als Textzeichenkette, etwa `font: "Libertinus Serif"` oder `align: "left"`. Damit solche Steuerwerte nicht versehentlich im CAT-Tool zur Übersetzung angeboten werden, lassen sich deren Argumentnamen unter `ignore_named_args` ausschliessen.
heading_lvl_1_h1_praxisbeispiel=Praxisbeispiel aus der Buchproduktion
text_p_praxis-1=Dieses Handbuch selbst dient als vollständiges Referenzprojekt für den beschriebenen Workflow. Der deutsche Ausgangstext befindet sich im Verzeichnis `docs/src_de/`, während die Layout-Komponenten zentral in `docs/lib/` gepflegt werden.
text_p_praxis-2=Aus dieser einzigen Quelle werden über die Konfigurationsdatei `docs/docs.yaml` die englische und die russische Fassung generiert. Beide Zielversionen binden dieselben Makros ein und erreichen dadurch ohne manuelle Nachbearbeitung ein identisches Druckbild.
text_p_id_1=TODO: 1 bis 2 eigene Funktionen aus docs/lib einfügen, zum Beispiel den Fazit-Block.
heading_lvl_1_h1_troubleshooting=Fehlerbehebung und Tipps für den Buchalltag
text_p_ts-1=In der täglichen Arbeit mit wachsenden Buchmanuskripten helfen folgende Hinweise, typische Stolpersteine schnell zu lösen:
text_p_ts-list-3=- *Nachträgliche Korrekturen im Original*: Ändert sich ein Satz im deutschen Ausgangstext, genügt ein erneuter Export. Im CAT-Tool bleiben alle unveränderten Sätze dank des Translation Memories als exakte Treffer erhalten, sodass nur der geänderte Satz neu übersetzt werden muss. <p:ts-list-1> - *Fehlende Übersetzung im Zieldokument*: Erscheint im rekonstruierten Typst-Dokument der Platzhalter `DE_TRANSLATION_MISSING`, wurde der entsprechende Eintrag im CAT-Tool noch nicht übersetzt oder die Zieldatei nach der Übersetzung noch nicht neu geschrieben. <p:ts-list-2> - *Sonderzeichen und Formatierungen*: Inline-Formatierungen wie `*fett*`, `_kursiv_` oder `#link(...)` werden vom Parser erkannt und als geschützte Tags an das CAT-Tool übergeben. Achte beim Übersetzen darauf, diese Tags an den passenden Stellen im Zielsatz beizubehalten.
heading_lvl_2_h2_omegat-tags=Geschützte Tags in OmegaT einrichten
text_p_ot-tags-1=Damit Inline-Formatierungen (`<b>`, `</b>`), Code-Schnipsel in Backticks (wie `.typ`) sowie interne Typst-Verweise beim Übersetzen nicht versehentlich verändert werden, sollten sie in OmegaT als benutzerdefinierte Tags geschützt werden.
text_p_ot-tags-2=Öffne dazu in OmegaT das Menü <b>Optionen</b> -> <b>Einstellungen</b> -> <b>Tag-Verarbeitung</b> und trage folgenden regulären Ausdruck in das Feld <b>Regulärer Ausdruck für benutzerdefinierte Tags</b> ein:
text_raw_ot-regex=\\s*\\[[^\\]]*\\]|#chapter-extract\\[|#initial\\[|<p_id_[^>]+>\\]|\\])", )
text_p_ot-tags-3=Achte beim Einfügen darauf, dass sich am Anfang und am Ende der Zeile kein versehentliches Leerzeichen befindet, da dieses sonst als leeres Tag gewertet wird. Lade das Projekt anschliessend mit der Taste `F5` neu, um die neuen Tags sofort sichtbar zu machen.
