func_title-author_title_author_arg=Marc Günthardt
func_title-main_title_main_arg=typst-xlatory
func_title-sub_title_sub_arg=Беспроигрышный «туда-обратно»-перевод для книг «Тypst»
func_title-note-right_title_note_arg=Руководство и пример проекта
func_title-publisher_title_pub_arg=Версия 1.0.0 — Документация с открытым исходным кодом
func_meta-set_1_arg=typst-xlatory
func_h1-serif_h1_einfuehrung_arg=Введение и архитектура
func_meta-teaser_teaser_intro_arg=Как можно редактировать многоязычные книги в Typst, не разделяя верстку и содержание?
heading_lvl_2_h2_id_2_cl-numbered=Цель
text_p_id_3=- Созданные PDF-документы должны поддаваться тщательной проверке и настройке вплоть до мельчайших деталей.
text_p_id_4=- Среда должна обеспечивать эффективное предоставление документов на нескольких языках.
text_p_id_5=- Основное внимание уделяется текстовому контенту, математические формулы не поддерживаются.
text_p_id_6=- В будущем должно быть возможно с разумными затратами расширить систему для автоматического создания альтернативных форматов, таких как HTML или Obsidian Markdown.
text_p_id_7=- Нужно использовать только компоненты с открытым исходным кодом.
heading_lvl_2_h2_architektur_cl-numbered=История создания и архитектура
func_dropcap-par_p_id_9_arg=Сначала я подумал, что стандарт EPUB 3 может стать хорошей основой, и пробовал создать более сложный формат с помощью разных генераторов PDF. Мне это удалось более-менее только с помощью Prince-Generator, который, к сожалению, не является открытым исходным кодом, да и может оказаться очень трудоемким, если требования сложные. Мне показалась заманчивой идея создать единый источник достоверной информации в формате Epub 3, на основе которого потом должны были бы формироваться PDF-файлы. Книга будет автоматически доступна как в печатном виде, так и в формате Epub. Поскольку формат EPUB использует HTML внутри, интеграция OmegaT в качестве среды перевода хорошо поддерживалась. В конце концов мне пришлось признать этот подход неудачным, так как доступные мне генераторы PDF с открытым исходным кодом не поддерживали точное оформление PDF-файлов.
text_p_id_10=Поэтому я решил разобраться, какие вообще существуют среды, позволяющие эффективно и точно работать с форматами PDF. И вот я наткнулся на Typst — это программа, которую чаще всего используют в академической среде и которая, помимо прочего, позволяет отображать математические формулы. В любом случае, Typst отлично справляется с конвертацией текстов в PDF — ведь не обязательно использовать весь набор функций. Еще одно большое преимущество Typst — это его возможности по стандартизации и унификации форматов. При переводе целой серии книг с похожими или одинаковыми форматами можно использовать одну-единственную библиотеку функций форматирования, и все книги серии будут отформатированы одинаково на всех языках, если эти языки пишутся слева направо и сверху вниз.
text_p_id_11=Правда, сначала я не смог применить свою переводческую среду OmegaT к файлам Typst — не было фильтров с достаточным набором функций. Так что я написал программу, которая преобразует файлы формата Typst в формат, понятный OmegaT. При этом каждому абзацу в Typst присваивается метка с идентификатором, и этот идентификатор затем служит ключом к текстам в OmegaT. Дополнительная программа берёт исходный документ и переведённые тексты и создаёт на их основе переведённый документ, форматированный точно так же, как и оригинал.
text_p_id_12=Таким образом, исходный документ в формате Typst становится для меня «единственным источником достоверной информации» и определяет структуру и формат всех производных и переведённых документов.
text_p_id_13=Поскольку я уже довольно хорошо знаком с набором языковых средств Typst, которые использую, я мог бы вместо пар «ключ-значение» по желанию генерировать и другие форматы, например HTML или Obsidian Markup. Так что ничто не мешает расширить возможности для создания альтернативных форматов.
func_question-cursive_q_intro_arg=Почему простое копирование файлов Typst не срабатывает, когда проекты книг становятся всё больше?
func_dropcap-par_p_intro-1_arg=Если ты пишешь книгу или обширную документацию в Typst и хочешь перевести её на несколько языков, то очень скоро столкнёшься с классической проблемой. Если скопировать файлы `.typ` для каждого языка и переводить прямо в исходном коде, то верстка и содержание не будут совпадать.
text_p_intro-2=Любые последующие изменения размера шрифта, интервалов или макросов придётся потом кропотливо вносить в каждый языковой файл по отдельности. В то же время в обычном текстовом редакторе нет важных инструментов для профессиональных переводчиков, таких как переводческие памяти и терминологические базы данных.
heading_lvl_2_h2_loesung_cl-numbered=Решение: разделение содержания и верстки
func_dropcap-par_p_loesung-1_arg=Этот инструмент служит связующим звеном между современной средой верстки Typst и устоявшимися программами для перевода (CAT-инструментами). Вместо того чтобы вручную копировать исходные файлы Typst, транспайлер извлекает только переводимые тексты и сохраняет их в стандартные Java-файлы `.properties`.
text_p_loesung-2=После перевода Reconstructor снова вставляет целевые тексты точно в исходную структуру Typst. При этом все инструкции по верстке, интервалы, ссылки и пользовательские функции полностью сохраняются.
heading_lvl_2_h2_loose-coupling_cl.numbered=Независимость от инструментов (слабая связь)
func_dropcap-par_p_coupling-1_arg=Система специально не привязана к какой-то конкретной программе перевода. Поскольку в качестве формата обмена используются обычные файлы `.properties`, этот рабочий процесс можно без проблем интегрировать с такими программами, как OmegaT, Poedit, Weblate или Crowdin.
text_p_coupling-2=Если автор позже решит сменить инструмент для перевода, все исходные файлы Typst и настройки проекта останутся без изменений.
func_h1-serif_h1_installation_arg=Установка и системные требования
func_dropcap-par_p_inst-1_arg=Для работы конвейера перевода в системе должны быть установлены три компонента:
text_p_inst-list-1=- <b>Typst</b> : Для компиляции готовых файлов `.typ` в PDF-документы, готовые к печати.
text_p_inst-list-2=- <b>CAT-инструмент</b> : Например, бесплатная программа с открытым исходным кодом OmegaT для непосредственной работы над переводом.
text_p_inst-list-3=- <b>typst-xlatory</b> : Скомпилированная утилита командной строки для экспорта и импорта текстов.
heading_lvl_2_h2_verzeichnisstruktur_cl-numbered=Рекомендуемая структура каталогов
func_dropcap-par_p_dir-1_arg=Чтобы шаблоны, исходные тексты, файлы перевода и готовые языковые версии оставались четко разграниченными, рекомендуется использовать следующую структуру папок для каждого книжного проекта:
text_p_dir-2=Каждый из этих каталогов выполняет следующие задачи:
text_p_dir-list-1=- <b>`projekt.yaml`</b> : главный файл настроек для путей и правил перевода.
text_p_dir-list-2=- <b>`lib/`</b> : Общие шаблоны Typst и макросы верстки для всех языков.
text_p_dir-list-3=- <b>`src_de/`</b> : исходные тексты книги на языке оригинала.
text_p_dir-list-4=- <b>`i18n/source/`</b> : экспортированные файлы `.properties` в качестве исходных данных для CAT-инструмента.
text_p_dir-list-5=- <b>`i18n/target_en/` и `i18n/target_ru/`</b>: переведённые файлы `.properties` из CAT-инструмента.
text_p_dir-list-6=- <b>`out_en/` и `out_ru/`</b> : реконструированные файлы Typst, готовые к компиляции, на целевых языках.
text_p_dir-3=Все восстановленные языковые версии обращаются к одной и той же папке `lib/` по относительным путям. Таким образом, любое изменение дизайна в шаблоне сразу же отражается на всех языковых версиях.
func_h1-serif_h1_schnellstart_arg=Быстрый старт
func_dropcap-par_p_quick-1_arg=Всего за пять простых шагов из немецкого документа в формате Typst получается многоязычная публикация.
heading_lvl_2_h2_schritt-1=Шаг 1: Создать исходный файл с метками
func_dropcap-par_p_s1-1_arg=Создай в папке `src_de/` файл `kapitel1.typ` и присвои заголовкам и абзацам уникальные метки в острых скобках:
heading_lvl_2_h2_schritt-2=Шаг 2: Создать конфигурацию проекта
func_dropcap-par_p_s2-1_arg=Создай в главной папке проекта файл `projekt.yaml`, в котором укажи каталоги и языки перевода:
heading_lvl_2_h2_schritt-3=Шаг 3: Экспорт текстов для перевода
func_dropcap-par_p_s3-1_arg=Запусти экспорт из командной строки:
text_p_s3-2=В папке `i18n/source/` теперь находится файл `kapitel1.properties` со всеми извлечёнными текстовыми фрагментами.
heading_lvl_2_h2_schritt-4=Шаг 4: Выполни перевод в CAT-инструменте
func_dropcap-par_p_s4-1_arg=Загрузи файл `kapitel1.properties` в свою программу для перевода (например, OmegaT) и после перевода создай целевые файлы в папках `i18n/target_en/` и `i18n/target_ru/` соответственно.
heading_lvl_2_h2_schritt-5=Шаг 5: Восстановить языки перевода и сгенерировать PDF
func_dropcap-par_p_s5-1_arg=В заключение запусти команду импорта и скомпилируй сгенерированные файлы Typst:
text_p_s5-2=В целевых папках теперь находятся готовые файлы Typst и PDF-файлы на всех настроенных языках.
func_h1-serif_h1_typst-subset_arg=Поддерживаемый набор языков Typst
func_dropcap-par_p_subset-1_arg=Чтобы гарантировать обратный перевод без потерь, `typst-xlatory` обрабатывает чётко определённое подмножество синтаксиса Typst. Все элементы, находящиеся за пределами этой текстовой области — например, указания по верстке — передаются без изменений.
heading_lvl_2_h2_subset-top-level_cl-numbered=Структура на самом верхнем уровне
func_dropcap-par_p_subset-top-1_arg=Парсер разбивает каждый файл `.typ` на самом верхнем уровне документа на четыре типа узлов:
text_p_subset-top-list-1=- <b>Заголовки</b> : Классические заголовки Typst ( `=` , `==` , `===` и т. д.) с опциональной меткой в конце строки.
text_p_subset-top-list-2=- <b>Абзацы и списки</b> : Блоки текста, разделенные пустыми строками, и элементы списка с опциональной меткой в конце.
text_p_subset-top-list-3=- <b>Вызовы собственных функций</b> : макросы верхнего уровня, такие как `#summary-box(title: "Merksatz:")[Inhalt] <box:1>`. Содержимое в квадратных скобках, а также именованные текстовые аргументы в двойных кавычках экспортируются; позиционные аргументы и параметры из `ignore_named_args` остаются без изменений.
text_p_subset-top-list-4=- <b>Директивы верстки</b>: такие команды, как `#import`, `#set`, `#show`, а также функции из `hide_functions`, пропускаются при экспорте и при импорте вставляются точно на свои исходные места.
heading_lvl_2_h2_subset-inline_cl-numbered=Поддерживаемые встроенные теги
func_dropcap-par_p_subset-inl-1_arg=Внутри абзацев и заголовков транспайлер распознает следующие встроенные элементы и надежно передает их в CAT-инструмент:
text_p_subset-inl-list-1=- <b>Жирный шрифт</b> : выделение текста звездочками ( `*fett*` ), в том числе в сочетании со ссылками.
text_p_subset-inl-list-2=- <b>Ссылки</b> : Внутренние ссылки и ссылки на другие сайты в формате `#link(<ziel>)[Linktext]`.
text_p_subset-inl-list-3=- *Встроенный код*: исходный код, заключённый в обратные кавычки (`` `...` ``), остаётся защищённым; острые скобки, содержащиеся в нём, не будут ошибочно интерпретироваться как метки сегментов.
heading_lvl_2_h2_subset-rules_cl-numbered=Важные правила для авторов
func_dropcap-par_p_subset-rules-1_arg=Чтобы парсер AST мог аккуратно разделить каждый сегмент, при написании кода нужно соблюдать два простых основных правила:
text_p_subset-rules-list-1=- <b>Плоская структура документа</b>: главы или несколько абзацев нельзя заключать в наружные скобки-контейнеры ( `[...]` ). Смена макета осуществляется исключительно с помощью операторов `#show:`.
text_p_subset-rules-list-2=- <b>Метки в конце блока</b> : Метка сегмента, например `<p:absatz-1>`, всегда должна находиться в самом конце абзаца или вызова функции и не должна содержать пробелов, обратных кавычек или дополнительных острых скобок.
heading_lvl_1_h1_best-practices=Структурируй текст для перевода
func_dropcap-par_p_bp-1_arg=Чтобы обмен данными между Typst и CAT-инструментом надежно работал даже при работе над крупными книжными проектами, хорошо зарекомендовали себя несколько основных правил написания исходных файлов.
heading_lvl_2_h2_labels_cl-numbered=Используй однозначные метки
func_dropcap-par_p_labels-1_arg=Каждый заголовок, каждый абзац и каждая переводимая функция должны заканчиваться уникальной меткой в острых скобках, например `<p:einleitung-1>` или `<box:merksatz-2>`.
text_p_labels-2=Если явно не указать метку, транспайлер автоматически присваивает последовательные номера. Если автор позже вставит новый абзац посреди главы, все последующие номера сдвинутся, что может привести к неправильному сопоставлению в CAT-инструменте.
text_p_labels-3=Благодаря фиксированным меткам каждый фрагмент текста навсегда привязан к своему идентификатору, независимо от того, где в документе добавляются или перемещаются абзацы.
heading_lvl_2_h2_information-hiding_cl-numbered=Применить метод скрытия информации
func_dropcap-par_p_ih-1_arg=Сложные команды верстки, такие как `#set par(...)`, `#show ...` или вложенные контейнеры `#block(...)`, не должны вставляться прямо в основной текст. Постоянно выноси такие форматирования в виде именованных функций в файл шаблона в папке `lib/`.
text_p_ih-2=В самом тексте главы тебе останется вызывать только лаконичные однострочные макросы. Благодаря этому переводчик видит в CAT-инструменте только сам текст без лишнего кода верстки.
heading_lvl_2_h2_eigene-funktionen_cl-numbered=Создание собственных функций Typst
func_dropcap-par_p_fn-1_arg=Свои собственные компоненты верстки, такие как инфобоксы, блоки цитат или блоки с выводами, транспайлер распознает автоматически. Если ты введешь основной текст в квадратных скобках, инструмент сразу экспортирует его как сегмент для перевода.
text_p_fn-2=Кроме того, транспайлер распознает все именованные аргументы, значение которых заключено в двойные кавычки. Вызов вроде `#fazit(title: "Zusammenfassung:")[Der eigentliche Inhalt.] <box:fazit-1>` автоматически создаёт две отдельные записи в файле `.properties`: одну для заголовка, а другую — для текста.
heading_lvl_2_h2_show-vs-container_cl-numbered=Переключение макета с помощью `#show` вместо скобок контейнера
func_dropcap-par_p_show-1_arg=Если для какого-то раздела документа нужно установить особые поля или правила форматирования абзацев (например, для титульного листа или основной части), эти функции верстки нельзя обозначать в виде больших контейнеров в квадратных скобках, охватывающих целые главы.
text_p_show-2=Транспайлер рассматривает содержимое в квадратных скобках как единый связный текстовый фрагмент и не разбивает в нём вложенные заголовки или другие макросы.
text_p_show-3=Вместо этого воспользуйся оператором Typst `#show:`, чтобы применить формат к следующему тексту, не вкладывая его в дерево документа:
text_p_show-4=Таким образом, все заголовки, абзацы и вызовы функций на верхнем уровне сохраняются и передаются в CAT-инструмент в виде отдельных сегментов.
func_summary-box_box_bp-summary_arg_title=Правило:
func_summary-box_box_bp-summary_arg=Стабильные метки и вынесенные макросы позволяют переводчикам в CAT-инструменте редактировать исключительно сам текст, в то время как верстка книги по-прежнему управляется централизованно.
heading_lvl_1_h1_konfiguration=Справочник по настройке
func_dropcap-par_p_cfg-1_arg=Вся работа конвейера экспорта и импорта управляется через центральный файл YAML. С помощью параметра `--config` можно указать отдельный файл конфигурации для каждого книжного проекта.
heading_lvl_2_h2_cfg-project=Раздел «project»
func_dropcap-par_p_cfg-proj-1_arg=В разделе `project` задаются общие исходные каталоги проекта:
text_p_cfg-proj-list-1=- <b>`source_dir`</b> : путь к каталогу с исходными файлами Typst на языке оригинала.
text_p_cfg-proj-list-2=- <b>`i18n_source_dir`</b> : целевая папка, в которую будут сохраняться сгенерированные файлы `.properties` для CAT-инструмента.
heading_lvl_2_h2_cfg-targets=Раздел «targets»
func_dropcap-par_p_cfg-tgt-1_arg=В разделе `targets` можно указать любое количество целевых языков. При запуске с опцией `--import` инструмент обрабатывает все указанные языки за один проход:
text_p_cfg-tgt-list-1=- <b>`lang`</b> : сокращённое обозначение языка вывода в консоли (например, `en` или `ru`).
text_p_cfg-tgt-list-2=- <b>`i18n_target_dir`</b> : каталог, в который CAT-инструмент сохраняет переведённые файлы `.properties` для этого языка.
text_p_cfg-tgt-list-3=- <b>`output_dir`</b> : целевой каталог для готовых реконструированных файлов Typst на соответствующем языке.
heading_lvl_2_h2_cfg-hide=Блок hide_functions
func_dropcap-par_p_cfg-hide-1_arg=Функции, которые управляют исключительно версткой и не содержат текста, подлежащего переводу (такие как `pagebreak`, `outline`, `v` или `h`), перечислены в `hide_functions`. Эти вызовы пропускаются при экспорте и при импорте переносятся в целевой документ без изменений.
heading_lvl_2_h2_cfg-ignore-args=Область ignore_named_args
func_dropcap-par_p_cfg-ign-1_arg=\nНекоторые функции Typst ожидают, что технические параметры будут указаны в виде текстовой строки, например `font: "Libertinus Serif"` или `align: "left"`. Чтобы такие значения параметров случайно не попадали в CAT-инструмент при переводе, их имена можно исключить с помощью параметра `ignore_named_args`.
func_h1-serif_h1_praxisbeispiel_arg=Практический пример из сферы книгоиздания
func_dropcap-par_p_praxis-1_arg=Само это руководство служит полноценным примером для описанного рабочего процесса. Исходный текст на немецком языке находится в папке `docs/src_de/`, а компоненты верстки хранятся в центральном каталоге `docs/lib/`.
text_p_praxis-2=Исходя из этого единственного источника, через файл конфигурации `docs/docs.yaml` генерируются английская и русская версии. Обе целевые версии включают одни и те же макросы, благодаря чему позволяют получить одинаковое изображение при печати без ручной доработки.
heading_lvl_2_h2_live-demo=Демонстрация компонентов верстки в режиме реального времени
func_dropcap-par_p_demo-1_arg=В приведённом ниже обзоре показано, как взаимодействуют двухколонные строки и диалоговые макросы при многоязычном наборе текста:
func_two-column-row_row_demo-1_arg=Напиши исходный текст на немецком языке один раз, используя фиксированные метки.
func_two-column-row_row_demo-2_arg=Без потерь выделяет все сегменты в стандартизированные файлы `.properties`.
func_speaker_spk_author_arg=Автор:
func_dropcap-par_p_dlg-1_arg=Я только что вставил новый абзац в третью главу. Мне теперь придётся переупорядочить все переводы?
func_speaker_spk_translator_arg=Переводчик:
func_dropcap-par_p_dlg-2_arg=Нет, благодаря фиксированным меткам все существующие предложения сохраняются в переводческой памяти.
func_small-note_note_demo_arg=Примечание: Все показанные блоки взяты прямо из библиотеки шаблонов в папке `docs/lib/`.
func_align-right_right_date_arg=По состоянию на ноябрь 2026 года — справочник по открытому исходному коду
func_h1-serif_h1_troubleshooting_arg=Устранение неполадок и советы по повседневной работе с книгами
func_dropcap-par_p_ts-1_arg=В повседневной работе с растущими книжными рукописями следующие советы помогут быстро справиться с типичными трудностями:
text_p_ts-list-1=- <b>Позже внесенные исправления в исходном тексте</b> : если в немецком исходном тексте изменилось какое-то предложение, достаточно просто экспортировать его заново. В CAT-инструменте все неизменённые предложения сохраняются как точные совпадения благодаря переводческой памяти, так что переводить заново нужно только то предложение, которое было изменено.
text_p_ts-list-2=- <b>Отсутствует перевод в целевом документе</b> : в восстановленном документе Typst появляется заполнитель `DE_TRANSLATION_MISSING` — это означает, что соответствующая запись в CAT-инструменте ещё не переведена или целевой файл ещё не был перезаписан после перевода.
text_p_ts-list-3=- <b>Специальные символы и форматирование</b> : Встроенное форматирование, такое как `*bold*`, `_italic_` или перекрестные ссылки ( `#link(...)` ), распознается парсером и передается в CAT-инструмент в виде защищенных тегов. При переводе постарайся сохранить эти теги в нужных местах в целевом предложении.
heading_lvl_2_h2_omegat-paths=Настройка путей для исходного и целевого текстов в OmegaT
text_p_id_3=Вместо того чтобы в Windows пробираться по запутанным диалоговым окнам OmegaT, можно изменить пути к исходному и целевому файлам прямо в текстовом редакторе в файле omegat.project (в соответствующей внешней папке проекта OmegaT), даже когда программа закрыта. Там пути представлены в виде простых XML-тегов ( `<source_dir>...</source_dir>` и `<target_dir>...</target_dir>` ), что работает намного быстрее и без ошибок.
heading_lvl_2_h2_omegat-tags=Настройка защищенных тегов в OmegaT
func_dropcap-par_p_ot-tags-1_arg=Чтобы при компиляции не были случайно изменены встроенное форматирование, фрагменты кода в обратных кавычках, такие как `.typ`, а также внутренние ссылки на Typst, их следует защитить в OmegaT с помощью пользовательских тегов.
text_p_ot-tags-2=Для этого открой в OmegaT меню <b>Параметры</b> -> <b>Настройки</b> -> <b>Обработка тегов</b> и введи следующее регулярное выражение в поле <b>Регулярное выражение для пользовательских тегов</b>:
text_p_ot-tags-3=При вставке следи за тем, чтобы в начале и в конце строки не было лишних пробелов, иначе они будут интерпретироваться как пустой тег. Затем перезагрузи проект, нажав клавишу `F5`, чтобы сразу увидеть новые теги.
text_p_ot-tags-4=Также поставь галочку в поле «Порядок переведённых тегов может отличаться».
