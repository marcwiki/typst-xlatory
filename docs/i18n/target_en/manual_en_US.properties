heading_lvl_1_h1_troubleshooting=Troubleshooting and Tips for Everyday Bookwork
func_dropcap-par_p_ts-1_arg=In your day-to-day work with growing book manuscripts, the following tips will help you quickly resolve common challenges:
text_p_ts-list-1=- <b>Subsequent corrections in the original</b>: If a sentence in the German source text changes, simply export it again. In the CAT tool, all unmodified sentences are retained as exact matches thanks to the translation memory, so that only the modified sentence needs to be translated anew.
text_p_ts-list-2=- <b>Missing translation in the target document</b>: The placeholder `DE_TRANSLATION_MISSING` appears in the reconstructed Typst document; either the corresponding entry in the CAT tool has not yet been translated, or the target file has not yet been rewritten after translation.
text_p_ts-list-3=- <b>Special Characters and Formatting</b>: Inline formatting such as `*bold*`, `_italic_`, or cross-references (`#link(...)`) are recognized by the parser and passed to the CAT tool as protected tags. When translating, be sure to keep these tags in the appropriate places in the target sentence.
heading_lvl_2_h2_omegat-tags=Setting Up Protected Tags in OmegaT
func_dropcap-par_p_ot-tags-1_arg=To ensure that inline formatting and code snippets enclosed in backticks, such as `.typ`, as well as internal Typst references, are not accidentally altered during translation, they should be protected as custom tags in OmegaT.
text_p_ot-tags-2=To do this, open the following menu in OmegaT: <b>Options</b> -> <b>Settings</b> -> <b>Tag Processing</b>, and enter the following regular expression in the <b>Regular Expression for User-Defined Tags</b> field:
text_p_ot-tags-3=When pasting, make sure there are no accidental spaces at the beginning or end of the line, as these will otherwise be interpreted as an empty tag. Then refresh the project by pressing the `F5` key to make the new tags visible immediately.
text_p_ot-tags-4=Also select the checkbox “Translated tags may be arranged differently.”
