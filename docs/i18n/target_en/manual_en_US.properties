heading_lvl_1_h1_id_1=An environment for creating and translating PDF documents
heading_lvl_2_h2_id_2=Objective
text_p_id_3=- The PDF documents generated should be fully controllable and customizable down to the finest detail.
text_p_id_4=- The environment should enable the efficient delivery of documents in multiple languages.
text_p_id_5=\n- The focus is on text content; mathematical formulas are not supported.
text_p_id_6=- A future expansion to enable the automated generation of alternative formats, such as HTML or Obisian Markdown, should be possible with a reasonable amount of effort.
text_p_id_7=- Only open-source components should be used.
heading_lvl_2_h2_id_8=History and Architecture
text_p_id_9=\nAt first, I assumed that the EPUB 3 standard might be a good starting point, so I tried using all kinds of PDF generators to create a more complex format. I was only able to do this reasonably well using the Prince Generator, which, unfortunately, is not open source and can also be very time-consuming when the specifications are complex. I found the idea appealing—a single source of truth in the EPUB 3 format, from which the PDF files would be generated. \nA book would automatically be available both as a print publication and as an ePub. Since an ePub uses HTML internally, the integration of OmegaT as a translation environment was well supported. At some point, I had to conclude that this approach had failed, since the open-source PDF generators available to me did not support precise formatting of PDF files.
text_p_id_10=So I focused my attention on identifying which environments actually exist that allow for the efficient and precise implementation of PDF formats. In the process, I came across Typst, which is mostly used in academic settings and, among other things, allows for the display of mathematical formulas. In any case, Typst does an excellent job of converting text to PDF—you don't have to use the full range of features. Another major advantage of Typst is its ability to standardize and unify formats. When translating an entire book series with similar or identical formats, you can use a single library of formatting functions, and all books in the series will be formatted identically in all languages, provided those languages are written from left to right and top to bottom.
text_p_id_11=However, at first I was unable to use my OmegaT translation environment with Typst files; there were no filters with sufficient functionality. So I wrote a program that converts Typst files into a format that OmegaT can read. \nIn this process, each paragraph in Typst is assigned a label with an ID, and this ID then serves as the key to the texts in OmegaT. A separate program takes the translated texts and uses the original document and these texts to create a translated document that is formatted exactly like the original.
text_p_id_12=\nThis makes the original Typst document my “single source of truth” and defines the structure and format for all translated documents.
text_p_id_13=Since I'm quite familiar with the language features I use in Typst, I could optionally generate other formats instead of key-value pairs—for example, HTML or Obisian Markup.
heading_lvl_1_h1_einfuehrung=Introduction and Motivation
text_p_intro-1=Anyone who writes a book or a lengthy document in Typst and wants to translate it into multiple languages will quickly run into a common problem. If you copy the `.typ` files for each language and translate directly in the source code, the layout and content will become mismatched.
text_p_intro-2=Any subsequent adjustments to font sizes, spacing, or macros must then be painstakingly applied to each individual language file. At the same time, a basic text editor lacks important tools used by professional translators, such as translation memories and terminology databases.
heading_lvl_2_h2_loesung=The Solution: Separating Content from Layout
text_p_loesung-1=This tool bridges the gap between Typst's modern typesetting environment and established translation software (CAT tools). Instead of manually duplicating raw Typst files, the transpiler extracts only the translatable text into standardized Java `.properties` files.
text_p_loesung-2=After translation, the Reconstructor reinsert the target texts exactly into the original Typst structure. All layout instructions, spacing, references, and user-defined functions are fully preserved in the process.
heading_lvl_2_h2_loose-coupling=Tool Independence (Loose Coupling)
text_p_coupling-1=The system is intentionally not tied to any specific translation program. Since standard `.properties` files are used as the exchange format, the workflow can be easily integrated with programs such as OmegaT, Poedit, Weblate, or Crowdin.
text_p_coupling-2=If an author switches to a different translation tool later on, all Typst source files and the project configuration remain unchanged.
heading_lvl_1_h1_installation=Installation and Prerequisites
text_p_inst-1=To use the translation pipeline, three components are required on the system:
text_p_inst-list-1=-<b>Typst</b> : To compile the finished `.typ` files into print-ready PDF documents.
text_p_inst-list-2=- <b>A CAT tool</b>: For example, the free, open-source program OmegaT for the actual translation work.
text_p_inst-list-3=- <b>typst-json-printer</b> : The compiled command-line tool for exporting and importing text.
heading_lvl_2_h2_verzeichnisstruktur=Recommended Directory Structure
text_p_dir-1=To ensure that templates, source texts, translation files, and finished language versions remain clearly separated, we recommend the following folder structure for each book project:
text_p_dir-2=The individual directories perform the following functions:
text_p_dir-list-1=- <b>`projekt.yaml`</b> : Central configuration file for paths and translation rules.
text_p_dir-list-2=- <b>`lib/`</b> : Shared Typest-templates and layout macros for all languages.
text_p_dir-list-3=- <b>`src_de/`</b>: Original texts from the book in the source language.
text_p_dir-list-4=- <b>`i18n/source/`</b> : Exported `.properties` files as input for the CAT tool.
text_p_dir-list-5=- <b>`i18n/target_en/` and `i18n/target_ru/`</b>: Translated `.properties` files from the CAT tool.
text_p_dir-list-6=- <b>`out_en/` and `out_ru/`</b>: Reconstructed, compilable TypeST files in the target languages.
text_p_dir-2=All reconstructed language versions access the same `lib/` folder via relative paths. As a result, a design change in the template immediately affects all language versions.
heading_lvl_1_h1_schnellstart=Quick Start
text_p_quick-1=In five quick steps, a German Typst document is transformed into a multilingual publication.
heading_lvl_2_h2_schritt-1=Step 1: Create a source file with labels
text_p_s1-1=Create a file named `kapitel1.typ` in the `src_de/` folder and assign unique labels in angle brackets to headings and paragraphs:
heading_lvl_2_h2_schritt-2=Step 2: Create a project configuration
text_p_s2-1=In the project's main folder, create a file named `projekt.yaml` that specifies the directories and target languages:
heading_lvl_2_h2_schritt-3=Step 3: Export text for translation
text_p_s3-1=Start the export from the command line:
text_p_s3-2=The file `kapitel1.properties`, containing all the extracted text segments, is now located in the `i18n/source/` folder.
heading_lvl_2_h2_schritt-4=Step 4: Translate using the CAT tool
text_p_s4-1=Load the file `kapitel1.properties` into your translation program (e.g., OmegaT) and, after translating, create the target files in `i18n/target_en/` or `i18n/target_ru/`.
heading_lvl_2_h2_schritt-5=Step 5: Reconstruct the target languages and build the PDF
text_p_s5-1=Finally, run the import command and compile the generated TypeS files:
text_p_s5-2=The target folders now contain the finished Typst files and PDFs in all configured languages.
heading_lvl_1_h1_best-practices=Structure the text for translation
text_p_bp-1=To ensure that the round trip between Typst and the CAT tool works reliably even for larger book projects, a few basic rules for writing source files have proven effective.
heading_lvl_2_h2_labels=Use Unambiguous Labels
text_p_labels-1=Every heading, paragraph, and translatable element should be enclosed in angle brackets with a unique label, such as `<p:einleitung-1>` or `<box:merksatz-2>`.
text_p_labels-2=If no explicit label is provided, the transpiler automatically assigns sequential numbers. If an author later inserts a new paragraph in the middle of a chapter, all subsequent numbers shift, which can lead to incorrect mappings in the CAT tool.
text_p_labels-3=With fixed labels, each text segment remains permanently linked to its identifier, regardless of where paragraphs are added or moved within the document.
heading_lvl_2_h2_information-hiding=Apply Information Hiding
text_p_ih-1=Complex layout instructions such as `#set par(...)`, `#show ...`, or nested `#block(...)` containers do not belong directly in the body text. Consistently move such formatting code into named functions in your template file in the `lib/` folder.
text_p_ih-2=In the actual chapter text, you then only call concise, single-line macros. This allows the translator to see only the content itself in the CAT tool, without any distracting layout code.
heading_lvl_2_h2_eigene-funktionen=Create Your Own Type Functions
text_p_fn-1=Custom layout components such as infoboxes, quote boxes, or summary blocks are automatically recognized by the transpiler. If you enter the main text in square brackets, the tool will export it directly as a translatable segment.
text_p_fn-2=In addition, the transpiler recognizes all named arguments whose values are enclosed in double quotes. A call such as `#fazit(title: "Zusammenfassung:")[Der eigentliche Inhalt.] <box:fazit-1>` automatically generates two separate entries in the `.properties` file: one for the title and one for the content.
heading_lvl_1_h1_konfiguration=Configuration Reference
text_p_cfg-1=The entire behavior of the export and import pipeline is controlled via a central YAML file. The `--config` parameter allows you to specify a separate configuration file for each book project.
heading_lvl_2_h2_cfg-project=Project Area
text_p_cfg-proj-1=The `project` section specifies the shared root directories for the project:
text_p_cfg-proj-list-1=- <b>`source_dir`</b> : Path to the directory containing the Typst source files in the original language.
text_p_cfg-proj-list-2=- <b>`i18n_source_dir`</b>: Destination folder where the generated `.properties` files are written for the CAT tool.
heading_lvl_2_h2_cfg-targets=“Targets” section
text_p_cfg-tgt-1=Under `targets`, you can define any number of target languages. When run with `--import`, the tool processes all listed languages in a single pass:
text_p_cfg-tgt-list-1=- <b>`lang`</b> : Abbreviation for the target language used for console logging (for example, `en` or `ru`).
text_p_cfg-tgt-list-2=- <b>`i18n_target_dir`</b>: Directory where the CAT tool stores the translated `.properties` files for this language.
text_p_cfg-tgt-list-3=- <b>`output_dir`</b> : Destination directory for the fully reconstructed Typst files for the respective language.
heading_lvl_2_h2_cfg-hide=Section hide_functions
text_p_cfg-hide-1=Functions that control only the layout and do not contain any translatable text (such as `pagebreak`, `outline`, `v`, or `h`) are listed under `hide_functions`. These calls are skipped during export and are carried over unchanged into the destination document during import.
heading_lvl_2_h2_cfg-ignore-args=“ignore_named_args” section
text_p_cfg-ign-1=Some Typst functions expect technical parameters as text strings, such as `font: "Libertinus Serif"` or `align: "left"`. To prevent such tax values from being accidentally offered for translation in the CAT tool, their argument names can be excluded using `ignore_named_args`.
heading_lvl_1_h1_praxisbeispiel=A Practical Example from Book Production
text_p_praxis-1=This manual itself serves as a complete reference project for the workflow described. The German source text is located in the `docs/src_de/` directory, while the layout components are maintained centrally in `docs/lib/`.
text_p_praxis-2=The English and Russian versions are generated from this single source via the configuration file `docs/docs.yaml`. Both target versions incorporate the same macros and thus produce an identical print output without the need for manual post-processing.
