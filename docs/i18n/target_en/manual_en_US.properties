heading_lvl_1_h1_best-practices=Structure the text for translation
func_dropcap-par_p_bp-1_arg=To ensure that the round trip between Typst and the CAT tool works reliably even for larger book projects, a few basic rules for writing source files have proven effective.
heading_lvl_2_h2_labels=Use Unambiguous Labels
func_dropcap-par_p_labels-1_arg=Every heading, paragraph, and translatable element should be enclosed in angle brackets with a unique label, such as `<p:einleitung-1>` or `<box:merksatz-2>`.
text_p_labels-2=If no explicit label is provided, the transpiler automatically assigns sequential numbers. If an author later inserts a new paragraph in the middle of a chapter, all subsequent numbers shift, which can lead to incorrect mappings in the CAT tool.
text_p_labels-3=With fixed labels, each text segment remains permanently linked to its identifier, regardless of where paragraphs are added or moved within the document.
heading_lvl_2_h2_information-hiding=Apply Information Hiding
func_dropcap-par_p_ih-1_arg=Complex layout instructions such as `#set par(...)`, `#show ...`, or nested `#block(...)` containers do not belong directly in the body text. Consistently move such formatting code into named functions in your template file in the `lib/` folder.
text_p_ih-2=In the actual chapter text, you then only call concise, single-line macros. This allows the translator to see only the content itself in the CAT tool, without any distracting layout code.
heading_lvl_2_h2_eigene-funktionen=Create Your Own Type Functions
func_dropcap-par_p_fn-1_arg=Custom layout components such as infoboxes, quote boxes, or summary blocks are automatically recognized by the transpiler. If you enter the main text in square brackets, the tool will export it directly as a translatable segment.
text_p_fn-2=In addition, the transpiler recognizes all named arguments whose values are enclosed in double quotes. A call such as `#fazit(title: "Zusammenfassung:")[Der eigentliche Inhalt.] <box:fazit-1>` automatically generates two separate entries in the `.properties` file: one for the title and one for the content.
heading_lvl_2_h2_show-vs-container=Layout toggle using `#show` instead of container brackets
func_dropcap-par_p_show-1_arg=If specific page margins or paragraph rules are to apply to a section of a document (such as the title page or the main body), these layout features must not be applied as large containers enclosed in square brackets around entire chapters.
text_p_show-2=The Transpiler treats the content within square brackets as a single, contiguous text segment and does not further parse any nested headings or other macros within it.
text_p_show-3=Instead, use the Typst command `#show:` to apply a layout to the text that follows without nesting the document tree:
text_p_show-4=This ensures that all headings, paragraphs, and function calls at the top level are preserved and passed to the CAT tool as separate segments.
heading_lvl_1_h1_konfiguration=Configuration Reference
func_dropcap-par_p_cfg-1_arg=The entire behavior of the export and import pipeline is controlled via a central YAML file. The `--config` parameter allows you to specify a separate configuration file for each book project.
func_summary-box_box_bp-summary_arg_title=Mnemonic:
func_summary-box_box_bp-summary_arg=Stable labels and external macros ensure that translators work exclusively on the actual content in the CAT tool, while the book layout remains centrally controlled.
heading_lvl_2_h2_cfg-project=Project Area
func_dropcap-par_p_cfg-proj-1_arg=The `project` section specifies the shared root directories for the project:
text_p_cfg-proj-list-1=- <b>`source_dir`</b> : Path to the directory containing the Typst source files in the original language.
text_p_cfg-proj-list-2=- <b>`i18n_source_dir`</b>: Destination folder where the generated `.properties` files are written for the CAT tool.
heading_lvl_2_h2_cfg-targets=“Targets” section
func_dropcap-par_p_cfg-tgt-1_arg=Under `targets`, you can define any number of target languages. When run with `--import`, the tool processes all listed languages in a single pass:
text_p_cfg-tgt-list-1=- <b>`lang`</b> : Abbreviation for the target language used for console logging (for example, `en` or `ru`).
text_p_cfg-tgt-list-2=- <b>`i18n_target_dir`</b>: Directory where the CAT tool stores the translated `.properties` files for this language.
text_p_cfg-tgt-list-3=- <b>`output_dir`</b> : Destination directory for the fully reconstructed Typst files for the respective language.
heading_lvl_2_h2_cfg-hide=Section hide_functions
func_dropcap-par_p_cfg-hide-1_arg=Functions that control only the layout and do not contain any translatable text (such as `pagebreak`, `outline`, `v`, or `h`) are listed under `hide_functions`. These calls are skipped during export and are carried over unchanged into the destination document during import.
heading_lvl_2_h2_cfg-ignore-args=“ignore_named_args” section
func_dropcap-par_p_cfg-ign-1_arg=Some Typst functions expect technical parameters as text strings, such as `font: "Libertinus Serif"` or `align: "left"`. To prevent such tax values from being accidentally offered for translation in the CAT tool, their argument names can be excluded using `ignore_named_args`.
heading_lvl_1_h1_praxisbeispiel=A Practical Example from Book Production
func_dropcap-par_p_praxis-1_arg=This manual itself serves as a complete reference project for the workflow described. The German source text is located in the `docs/src_de/` directory, while the layout components are maintained centrally in `docs/lib/`.
text_p_praxis-2=The English and Russian versions are generated from this single source via the configuration file `docs/docs.yaml`. Both target versions incorporate the same macros and thus produce an identical print output without the need for manual post-processing.
