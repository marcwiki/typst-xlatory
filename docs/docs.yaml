# docs/docs.yaml - Konfigurationsdatei für die mehrsprachige Gebrauchsanleitung

project:
  source_dir: "docs/src_de"
  i18n_source_dir: "docs/i18n/source"

targets:
  - lang: "en"
    i18n_target_dir: "docs/i18n/target_en"
    output_dir: "docs/out_en"
  - lang: "ru"
    i18n_target_dir: "docs/i18n/target_ru"
    output_dir: "docs/out_ru"

hide_functions:
  # Typst-Standardbefehle
  - outline
  - pagebreak
  - include
  - raw
  - show
  - v
  - h
  - link

  # Eigene Layout-Makros aus docs/lib/
  - layout-cover
  - layout-frontmatter
  - layout-title-page
  - layout-body-text
  - layout-sub-toc
  - layout-regex-box


ignore_named_args:
  # Typst-Standards
  - font
  - style
  - weight
  - lang
  - region
  - fill
  - stroke
  - align

  # custom names:
  - key
